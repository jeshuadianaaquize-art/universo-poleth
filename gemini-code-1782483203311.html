<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor YouTube - Cat Edition V4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo de gatito */
            background-image: url('https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* Diseño Glassmorphism */
        .player-card, .playlist-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 350px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .player-card {
            padding: 30px;
            text-align: center;
        }

        .icon-cat {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .track-info h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info h3 {
            font-size: 0.9rem;
            font-weight: 400;
            color: #ddd;
            margin-bottom: 20px;
            height: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        button {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-round { width: 45px; height: 45px; }
        .btn-play { width: 55px; height: 55px; font-size: 24px; }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .btn-list {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 14px;
            width: 100%;
        }

        /* Panel de la lista de canciones */
        .playlist-panel {
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .playlist-panel.show {
            display: block;
        }

        #playlistItems {
            list-style: none;
            text-align: left;
        }

        #playlistItems li {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #playlistItems li:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #playlistItems li.active {
            font-weight: bold;
            color: #ffde59;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.5); border-radius: 10px; }

        /* TRUCO ANTI-BLOQUEO: El iframe es de 1 pixel y transparente */
        .yt-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="player-card">
            <div class="icon-cat">😸🎧</div>
            <div class="track-info">
                <h2 id="title">Conectando a YouTube...</h2>
                <h3 id="artist"></h3>
            </div>
            
            <div class="controls">
                <button class="btn-round" id="prevBtn" title="Anterior">⏪</button>
                <button class="btn-play" id="playPauseBtn" title="Reproducir/Pausar">▶️</button>
                <button class="btn-round" id="nextBtn" title="Siguiente">⏩</button>
            </div>

            <button class="btn-list" id="toggleListBtn">📜 Mostrar / Ocultar Lista</button>
        </div>

        <div class="playlist-panel" id="playlistPanel">
            <ul id="playlistItems">
                </ul>
        </div>
    </div>

    <div class="yt-container">
        <div id="ytplayer"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isPlaylistBuilt = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '1',
                width: '1',
                playerVars: {
                    listType: 'playlist',
                    list: 'PLcIsKP9KitUoGPCINCGt9cGy_ys8EBVqx', // Tu playlist
                    autoplay: 0,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError // Aquí detectamos bloqueos
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('title').innerText = "¡Todo listo!";
            document.getElementById('artist').innerText = "Haz clic en ▶️ para empezar";
            
            // Le damos tiempo a YouTube para procesar la lista
            setTimeout(() => {
                buildPlaylistMenu();
            }, 1500);
        }

        // --- EL NUEVO CÓDIGO DE AUTO-SALTO ---
        function onPlayerError(event) {
            document.getElementById('title').innerText = "Canción bloqueada 🚫";
            document.getElementById('artist').innerText = "Buscando una permitida...";
            
            // Espera 2 segundos y salta al siguiente video automáticamente
            setTimeout(() => {
                if (player) {
                    player.nextVideo();
                }
            }, 2000);
        }
        // ------------------------------------

        function buildPlaylistMenu() {
            if (!player || !player.getPlaylist) return;
            const playlistIds = player.getPlaylist();
            
            if (!playlistIds || playlistIds.length === 0) {
                setTimeout(buildPlaylistMenu, 1000);
                return;
            }

            const ul = document.getElementById('playlistItems');
            ul.innerHTML = ''; 

            for (let i = 0; i < playlistIds.length; i++) {
                let li = document.createElement('li');
                li.innerText = `🎵 Pista ${i + 1}`;
                li.id = `track-${i}`;
                li.onclick = () => {
                    player.playVideoAt(i);
                };
                ul.appendChild(li);
            }
            isPlaylistBuilt = true;
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (!isPlaylistBuilt) buildPlaylistMenu();
                
                document.getElementById('playPauseBtn').innerText = "⏸️";
                
                let videoData = player.getVideoData();
                let fullTitle = videoData.title;
                let currentIndex = player.getPlaylistIndex();

                let partes = fullTitle.split('-');
                let titleEl = document.getElementById('title');
                let artistEl = document.getElementById('artist');

                if (partes.length > 1) {
                    artistEl.innerText = partes[0].trim();
                    titleEl.innerText = partes.slice(1).join('-').trim();
                } else {
                    titleEl.innerText = fullTitle;
                    artistEl.innerText = videoData.author || "Artista Desconocido";
                }

                // Actualizar menú
                let allLi = document.querySelectorAll('#playlistItems li');
                allLi.forEach(el => el.classList.remove('active'));

                let activeLi = document.getElementById(`track-${currentIndex}`);
                if (activeLi) {
                    activeLi.innerText = fullTitle;
                    activeLi.classList.add('active');
                }
            } 
            else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                document.getElementById('playPauseBtn').innerText = "▶️";
            }
        }

        // Eventos de botones
        document.getElementById('toggleListBtn').addEventListener('click', () => {
            document.getElementById('playlistPanel').classList.toggle('show');
        });

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else if (player) {
                player.playVideo();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (player) player.nextVideo();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (player) player.previousVideo();
        });
    </script>
</body>
</html>
