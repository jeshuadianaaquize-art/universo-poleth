        // ── NEBULOSA GATO VOLUMÉTRICA #2 (reemplaza el plano grande original) ───────
        // Mismo shader de silueta de gato pero con u_seed para variación,
        // construida como grupo de 5 capas igual que crearNebulaVolumen.
        const catVolVertShader = `
                varying vec2 vUv;
                void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
            `;
        const catVolFragShader = `
                uniform float u_time;
                uniform float u_seed;
                uniform float u_layerOp;
                varying vec2 vUv;

                float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
                float noise(vec3 x){
                    vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
                    return mix(mix(mix(hash(i),            hash(i+vec3(1,0,0)),f.x),
                                   mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                                   mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
                }
                float fbm(vec3 p){
                    float v=0.0,a=0.5;
                    for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.1+vec3(5.2+u_seed,1.3,3.7+u_seed*0.7);a*=0.5;}
                    return v;
                }

                float sdCircle(vec2 p,vec2 c,float r){ return length(p-c)-r; }
                float sdTriangle(vec2 p,vec2 a,vec2 b,vec2 c2){
                    vec2 e0=b-a,e1=c2-b,e2=a-c2;
                    vec2 v0=p-a,v1=p-b,v2=p-c2;
                    vec2 pq0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.0,1.0);
                    vec2 pq1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.0,1.0);
                    vec2 pq2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.0,1.0);
                    float s=sign(e0.x*e2.y-e0.y*e2.x);
                    vec2 d=min(min(vec2(dot(pq0,pq0),s*(v0.x*e0.y-v0.y*e0.x)),
                                   vec2(dot(pq1,pq1),s*(v1.x*e1.y-v1.y*e1.x))),
                                   vec2(dot(pq2,pq2),s*(v2.x*e2.y-v2.y*e2.x)));
                    return -sqrt(d.x)*sign(d.y);
                }
                float sdCapsule(vec2 p,vec2 a,vec2 b,float r){
                    vec2 pa=p-a,ba=b-a;
                    return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0))-r;
                }
                // cuerpo del gato: elipse grande debajo de la cabeza
                float sdEllipse(vec2 p,vec2 c,vec2 ab){
                    vec2 q=(p-c)/ab; return (length(q)-1.0)*min(ab.x,ab.y);
                }

                float catFullMask(vec2 p){
                    // cabeza
                    float head = sdCircle(p, vec2(0.0, 0.28), 0.30);
                    // orejas
                    float earL = sdTriangle(p, vec2(-0.28,0.42),vec2(-0.06,0.42),vec2(-0.20,0.66));
                    float earR = sdTriangle(p, vec2( 0.06,0.42),vec2( 0.28,0.42),vec2( 0.20,0.66));
                    // cuerpo: elipse vertical centrada abajo
                    float body = sdEllipse(p, vec2(0.0,-0.22), vec2(0.26,0.38));
                    // cola: cápsula arqueada a la derecha
                    float tail1 = sdCapsule(p, vec2(0.26,-0.50), vec2(0.55,-0.38), 0.055);
                    float tail2 = sdCapsule(p, vec2(0.55,-0.38), vec2(0.68,-0.10), 0.048);
                    float tail3 = sdCapsule(p, vec2(0.68,-0.10), vec2(0.62, 0.12), 0.040);
                    float tail  = min(min(tail1,tail2),tail3);
                    // patas delanteras: dos cápsulas cortas abajo del cuerpo
                    float pL = sdCapsule(p, vec2(-0.14,-0.56), vec2(-0.14,-0.72), 0.055);
                    float pR = sdCapsule(p, vec2( 0.14,-0.56), vec2( 0.14,-0.72), 0.055);
                    // unión de todo
                    float solid = min(min(min(head,min(earL,earR)),body),min(min(tail,pL),pR));
                    // bigotes
                    float wr=0.011;
                    float w1L=sdCapsule(p,vec2(-0.28,0.28),vec2(-0.56,0.26),wr);
                    float w2L=sdCapsule(p,vec2(-0.28,0.24),vec2(-0.56,0.20),wr);
                    float w1R=sdCapsule(p,vec2( 0.28,0.28),vec2( 0.56,0.26),wr);
                    float w2R=sdCapsule(p,vec2( 0.28,0.24),vec2( 0.56,0.20),wr);
                    float whiskers=min(min(w1L,w2L),min(w1R,w2R));
                    float bodyMask    = smoothstep( 0.04,-0.04, solid);
                    float whiskerMask = smoothstep( 0.008,-0.008, whiskers)*0.5;
                    return max(bodyMask, whiskerMask);
                }

                void main(){
                    vec2 uv=(vUv-0.5)*2.1;
                    float mask=catFullMask(uv);
                    if(mask<0.01) discard;

                    float t=u_time*0.07+u_seed*2.3;
                    vec3 p=vec3(uv*2.5+u_seed*4.0,t);
                    vec3 q=vec3(fbm(p),fbm(p+vec3(1.7,0.9,2.3)),0.0);
                    vec3 r2=vec3(fbm(p+q*2.0+t),fbm(p+q*1.8-t),0.0);
                    float den=fbm(p+r2*2.5);
                    den=smoothstep(0.15,0.85,den);
                    den=pow(den,1.5)*mask;

                    // paleta azul-turquesa-blanco nacarado (distinta al gato rosa)
                    vec3 cA=vec3(0.00,0.05,0.30);
                    vec3 cB=vec3(0.00,0.28,0.58);
                    vec3 cC=vec3(0.10,0.62,0.80);
                    vec3 cD=vec3(0.70,0.92,0.98);
                    vec3 col=mix(cA,cB,smoothstep(0.0,0.35,den));
                    col     =mix(col,cC,smoothstep(0.35,0.70,den));
                    col     =mix(col,cD,smoothstep(0.70,1.00,den));
                    col    +=vec3(0.05,0.20,0.35)*smoothstep(0.6,1.0,den)*mask*0.4;

                    gl_FragColor=vec4(col, den*u_layerOp);
                }
            `;

        // 5 capas volumétricas — misma lógica que crearNebulaVolumen
        const catVolCapas = [
            { dz: 0, scale: 1.00, seed: 0.0, op: 0.65, rx: 0.00, ry: 0.00 },
            { dz: 45, scale: 0.84, seed: 1.4, op: 0.50, rx: 0.16, ry: 0.11 },
            { dz: -45, scale: 0.90, seed: 2.8, op: 0.45, rx: -0.14, ry: -0.09 },
            { dz: 85, scale: 0.66, seed: 4.2, op: 0.36, rx: 0.26, ry: -0.18 },
            { dz: -80, scale: 0.71, seed: 5.6, op: 0.30, rx: -0.20, ry: 0.17 },
        ];
        const catVolGroup = new THREE.Group();
        catVolGroup.position.set(-1500, 500, -2400);
        catVolGroup.rotation.y = 0.5;

        const catVolMats = [];
        catVolCapas.forEach(c => {
            const mat = new THREE.ShaderMaterial({
                vertexShader: catVolVertShader,
                fragmentShader: catVolFragShader,
                uniforms: {
                    u_time: { value: 0.0 },
                    u_seed: { value: c.seed },
                    u_layerOp: { value: c.op },
                },
                transparent: true, depthWrite: false,
                blending: THREE.AdditiveBlending, side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(950 * c.scale, 950 * c.scale), mat);
            mesh.position.set(0, 0, c.dz);
            mesh.rotation.x = 0.35 + c.rx;
            mesh.rotation.y = c.ry;
            catVolGroup.add(mesh);
            catVolMats.push(mat);
        });
        scene.add(catVolGroup);

        // ── VÍA LÁCTEA SUTIL ─────────────────────────────────────────────────────
        const mlGeo = new THREE.BufferGeometry(), mlPos = new Float32Array(8000 * 3);
        for (let i = 0; i < 8000 * 3; i += 3) {
            const a = Math.random() * Math.PI * 2, bw = (Math.random() - 0.5) * 120, d = 1400 + (Math.random() - 0.5) * 600;
            mlPos[i] = d * Math.cos(a); mlPos[i + 1] = bw * 0.15; mlPos[i + 2] = d * Math.sin(a);
        }
        mlGeo.setAttribute('position', new THREE.BufferAttribute(mlPos, 3));
        const milkyWay = new THREE.Points(mlGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.0, transparent: true, opacity: 0.35, sizeAttenuation: true, fog: false }));
        milkyWay.rotation.x = Math.PI * 0.08; scene.add(milkyWay);

        // ── POLVO CÓSMICO ─────────────────────────────────────────────────────────
        const dustGeo = new THREE.BufferGeometry(), dPos = new Float32Array(5000 * 3);
        for (let i = 0; i < 5000 * 3; i += 3) {
            const r = 100 + Math.random() * 1200, t = Math.random() * 6.28, p = Math.acos(2 * Math.random() - 1);
            dPos[i] = r * Math.sin(p) * Math.cos(t); dPos[i + 1] = r * Math.sin(p) * Math.sin(t); dPos[i + 2] = r * Math.cos(p);
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
        const dustParticles = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.0, transparent: true, opacity: 0.4, sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        scene.add(dustParticles);

        // ── CONSTELACIONES ────────────────────────────────────────────────────────

        const RC = 1800;
        function esf(az, el) { const a = az * Math.PI / 180, e = el * Math.PI / 180; return [RC * Math.cos(e) * Math.cos(a), RC * Math.sin(e), RC * Math.cos(e) * Math.sin(a)]; }
        const constelaciones = [
            { estrellas: [esf(5, -8), esf(10, -5), esf(8, 2), esf(2, 2), esf(-2, -2), esf(5, -12), esf(15, -12)], links: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0], [0, 5], [1, 6], [5, 6]] },
            { estrellas: [esf(165, 50), esf(172, 48), esf(178, 44), esf(185, 46), esf(192, 52), esf(200, 56), esf(195, 48), esf(182, 45)], links: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5], [4, 6], [6, 7], [7, 2]] },
            { estrellas: [esf(340, 58), esf(348, 60), esf(356, 56), esf(362, 59), esf(370, 57)], links: [[0, 1], [1, 2], [2, 3], [3, 4]] },
            { estrellas: [esf(298, -57), esf(302, -54), esf(305, -60), esf(306, -56)], links: [[0, 1], [1, 2], [2, 3], [3, 0]] },
            { estrellas: [esf(244, -26), esf(248, -32), esf(252, -38), esf(255, -44), esf(260, -35)], links: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 1]] },
            { estrellas: [esf(284, 38), esf(288, 35), esf(291, 33), esf(286, 36)], links: [[0, 1], [1, 2], [2, 3], [3, 0]] },
            { estrellas: [esf(297, 8), esf(300, 2), esf(302, 5), esf(303, 14)], links: [[0, 1], [1, 2], [2, 3]] },
            { estrellas: [esf(113, 28), esf(110, 24), esf(115, 20), esf(120, 32)], links: [[0, 1], [1, 2], [2, 3], [3, 0]] },
            { estrellas: [esf(152, 20), esf(155, 16), esf(158, 22), esf(162, 26)], links: [[0, 1], [1, 2], [2, 3], [3, 0]] },
            { estrellas: [esf(345, 27), esf(348, 22), esf(352, 20), esf(358, 28)], links: [[0, 1], [1, 2], [2, 3], [3, 0]] },
            { estrellas: [esf(355, 38), esf(360, 28), esf(5, 35), esf(14, 44)], links: [[0, 1], [1, 2], [2, 3]] },
            { estrellas: [esf(50, 48), esf(53, 44), esf(55, 50), esf(58, 46)], links: [[0, 1], [1, 2], [2, 3], [3, 0]] },
            // ── ACUARIO
            {
                estrellas: [
                    esf(71, -7),   // 0: Beta Aqr (Sadalsuud)
                    esf(77, -9),   // 1: Alpha Aqr (Sadalmelik)
                    esf(65, -11),  // 2: Epsilon Aqr (Albali)
                    esf(63, -16),  // 3: Nu Aqr
                    esf(75, -17),  // 4: Theta Aqr (Ancha)
                    esf(81, -11),  // 5: Gamma Aqr (Sadalachbia)
                    esf(83, -10),  // 6: Zeta Aqr (Centro de la Jarra)
                    esf(84, -8),   // 7: Pi Aqr
                    esf(85, -11),  // 8: Eta Aqr
                    esf(78, -21),  // 9: Lambda Aqr (Mano / Inicio del chorro)
                    esf(83, -25),  // 10: Delta Aqr (Skat)
                    esf(85, -31),  // 11: c2 Aqr
                    esf(87, -37),  // 12: 88 Aqr (Fin línea izquierda del agua)
                    esf(76, -26),  // 13: Tau Aqr
                    esf(74, -33),  // 14: 98 Aqr
                    esf(72, -39)   // 15: 101 Aqr (Fin línea derecha del agua)
                ],
                links: [
                    [0, 1], [0, 2], [2, 3], [1, 4], [1, 5],
                    [5, 6], [6, 7], [6, 8], [7, 8],
                    [5, 9],
                    [9, 10], [10, 11], [11, 12],
                    [9, 13], [13, 14], [14, 15]
                ]
            }
        ];
        constelaciones.forEach(con => {
            const ptGeo = new THREE.BufferGeometry(), ptPos = new Float32Array(con.estrellas.length * 3);
            con.estrellas.forEach((e, i) => { ptPos[i * 3] = e[0]; ptPos[i * 3 + 1] = e[1]; ptPos[i * 3 + 2] = e[2]; });
            ptGeo.setAttribute('position', new THREE.BufferAttribute(ptPos, 3));
            scene.add(new THREE.Points(ptGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 5.0, transparent: true, opacity: 0.95, sizeAttenuation: true, fog: false })));
            con.links.forEach(([a, b]) => {
                if (a >= con.estrellas.length || b >= con.estrellas.length) return;
                const lGeo = new THREE.BufferGeometry();
                lGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([con.estrellas[a][0], con.estrellas[a][1], con.estrellas[a][2], con.estrellas[b][0], con.estrellas[b][1], con.estrellas[b][2]]), 3));
                scene.add(new THREE.Line(lGeo, new THREE.LineBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false })));
            });
        });

        // ── CÚMULOS ESTELARES ─────────────────────────────────────────────────────
        function crearCumulo(cx, cy, cz, n, radio) {
            const geo = new THREE.BufferGeometry(), pos = new Float32Array(n * 3);
            for (let i = 0; i < n * 3; i += 3) {
                const u = Math.random(), v = Math.random(), w = Math.random();
                const r = radio * Math.cbrt(u), theta = Math.acos(2 * v - 1), phi = 2 * Math.PI * w;
                pos[i] = cx + r * Math.sin(theta) * Math.cos(phi); pos[i + 1] = cy + r * Math.sin(theta) * Math.sin(phi); pos[i + 2] = cz + r * Math.cos(theta);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, transparent: true, opacity: 0.7, sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        }
        [[-1200, 300, -800, 280, 60], [900, -400, 1100, 220, 50], [600, 800, -900, 180, 45], [-700, -600, 700, 240, 55], [1400, 200, 300, 160, 40]].forEach(p => scene.add(crearCumulo(...p)));

        // ── METEORITOS REALISTAS ──────────────────────────────────────────────
        function crearMeteorito() {
            const radio = 700 + Math.random() * 1000, theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1) * 0.6;
            const sx = radio * Math.sin(phi) * Math.cos(theta), sy = 300 + Math.random() * 500, sz = radio * Math.sin(phi) * Math.sin(theta);
            const dx = (Math.random() - 0.5) * 1.2, dy = -0.8 - Math.random() * 0.5, dz = (Math.random() - 0.5) * 1.2;
            const dl = Math.sqrt(dx * dx + dy * dy + dz * dz);
            const speed = 5 + Math.random() * 10;
            const size = 1.2 + Math.random() * 2.8;

            // Núcleo del meteorito (roca brillante)
            const coreGeo = new THREE.BufferGeometry();
            const verts = new Float32Array([-5, -5, -5, 5, 5, 5]);
            coreGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            const coreMat = new THREE.PointsMaterial({
                color: 0xffaa44, size: size * 6, transparent: true, opacity: 0.85,
                blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
            });
            const core = new THREE.Points(coreGeo, coreMat);

            // Cola de fuego (estela)
            const tailGeo = new THREE.BufferGeometry();
            const tailLen = 80 + Math.random() * 180;
            const tailPos = new Float32Array((12) * 3);
            for (let s = 0; s < 12; s++) {
                tailPos[s * 3] = -(s * tailLen / 12);
                tailPos[s * 3 + 1] = (Math.random() - 0.5) * 3;
                tailPos[s * 3 + 2] = (Math.random() - 0.5) * 3;
            }
            tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
            const tailMat = new THREE.LineBasicMaterial({
                color: 0xff7722, transparent: true, opacity: 0.6,
                blending: THREE.AdditiveBlending, depthWrite: false, linewidth: 2
            });
            const tail = new THREE.Line(tailGeo, tailMat);

            const group = new THREE.Group();
            group.add(core);
            group.add(tail);
            group.position.set(sx, sy, sz);
            const dir = new THREE.Vector3(dx / dl, dy / dl, dz / dl);
            group.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir);
            scene.add(group);

            return { group, core, tail, dir, speed, life: 0, maxLife: 70 + Math.random() * 60 };
        }

        const meteoritos = [];
        let tMeteorito = 0;
        function actualizarMeteoritos(frame) {
            if (frame - tMeteorito > 120 + Math.random() * 80) {
                if (meteoritos.length < 8) meteoritos.push(crearMeteorito());
                tMeteorito = frame;
            }
            for (let i = meteoritos.length - 1; i >= 0; i--) {
                const m = meteoritos[i]; m.life++;
                const t = m.life / m.maxLife;
                m.group.position.addScaledVector(m.dir, m.speed);
                let alpha;
                if (t < 0.05) alpha = t / 0.05;
                else if (t < 0.8) alpha = 1.0;
                else alpha = 1.0 - (t - 0.8) / 0.2;
                alpha = Math.max(0, alpha);
                m.core.material.opacity = alpha * 0.95;
                m.tail.material.opacity = alpha * 0.55;
                if (m.life >= m.maxLife) {
                    scene.remove(m.group);
                    m.core.geometry.dispose();
                    m.core.material.dispose();
                    m.tail.geometry.dispose();
                    m.tail.material.dispose();
                    meteoritos.splice(i, 1);
                }
            }
        }

        // ── ESTRELLAS FUGACES ─────────────────────────────────────────────────────
        const fugaces = [];
        function crearEstrellaFugaz() {
            const radio = 600 + Math.random() * 800, theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1) * 0.5;
            const sx = radio * Math.sin(phi) * Math.cos(theta), sy = 200 + Math.random() * 400, sz = radio * Math.sin(phi) * Math.sin(theta);
            const dx = (Math.random() - 0.5) * 2, dy = -0.5 - Math.random() * 0.5, dz = (Math.random() - 0.5) * 2;
            const dl = Math.sqrt(dx * dx + dy * dy + dz * dz), length = 60 + Math.random() * 100;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0, length, 0, 0]), 3));
            const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
            const line = new THREE.Line(geo, mat);
            line.position.set(sx, sy, sz);
            line.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), new THREE.Vector3(dx / dl, dy / dl, dz / dl));
            scene.add(line);
            return { mesh: line, dir: new THREE.Vector3(dx / dl, dy / dl, dz / dl), speed: 3 + Math.random() * 5, life: 0, maxLife: 60 + Math.random() * 40 };
        }
        let tUF = 0;
        function actualizarFugaces(frame) {
            if (frame - tUF > 80 + Math.sin(frame * 0.01) * 40) { if (fugaces.length < 12) fugaces.push(crearEstrellaFugaz()); tUF = frame; }
            for (let i = fugaces.length - 1; i >= 0; i--) {
                const f = fugaces[i]; f.life++; const t = f.life / f.maxLife;
                f.mesh.position.addScaledVector(f.dir, f.speed);
                const alpha = t < 0.15 ? t / 0.15 : t < 0.7 ? 1.0 : 1.0 - (t - 0.7) / 0.3;
                f.mesh.material.opacity = Math.max(0, alpha * 0.95);
                if (f.life >= f.maxLife) { scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); fugaces.splice(i, 1); }
            }
        }

        // ── ANIMACIÓN ─────────────────────────────────────────────────────────────
        let frame = 0;
        const clockNebula = { start: Date.now() };
        function animate() {
            requestAnimationFrame(animate); frame++;
            controls.update();
            centerGroup.rotation.y += 0.0008; sign.lookAt(camera.position);
            // Órbitas reales: cada planeta se mueve en un círculo alrededor del
            // sol (origen), además de rotar sobre su propio eje.
            planetasOrbitando.forEach(p => {
                p.ang += p.velOrbital;
                p.mesh.position.set(Math.cos(p.ang) * p.radio, 0, Math.sin(p.ang) * p.radio);
                p.mesh.rotation.y += p.velSpin;
            });
            // Luna: orbita alrededor de la Tierra (su mesh padre), no del sol
            if (lunaMesh.userData.orbitaLuna) {
                const lu = lunaMesh.userData;
                lu.ang += lu.vel;
                lunaMesh.position.set(Math.cos(lu.ang) * lu.radio, 0, Math.sin(lu.ang) * lu.radio);
                lunaMesh.rotation.y += lu.spin;
            }
            scene.children.forEach(c => { if (c.isSprite && c.userData.sp) c.position.y = c.userData.y + Math.sin(Date.now() * 0.002) * 2; });
            milkyWay.rotation.y += 0.00005;
            dustParticles.rotation.y += 0.00008; dustParticles.rotation.x += 0.00003;
            const tNow = (Date.now() - clockNebula.start) * 0.001;
            starTwinkleMat.uniforms.u_time.value = tNow;
            agujerosNegros.forEach(bh => { bh.mats.forEach(m => { m.uniforms.u_time.value = tNow; }); });
            sunCoronaMats.forEach((m, i) => { m.uniforms.u_time.value = tNow + i * 1.7; });
            catVolMats.forEach(m => { m.uniforms.u_time.value = tNow; });
            nebulaGLSLMeshes.forEach(m => { m.uniforms.u_time.value = tNow; });
            catNebulaMat.uniforms.u_time.value = tNow;
            actualizarMeteoritos(frame);
            actualizarFugaces(frame);
            actualizarCinturonRocas();
            actualizarCinturonRocasPoleth();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
