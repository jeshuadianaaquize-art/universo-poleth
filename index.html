<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Para Poleth ✨</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        /* ── PANTALLA INICIO ── */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a0015 0%, #000000 100%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease-out;
        }

        #texto-carga {
            color: #00e5ff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 50px;
            text-shadow: 0 0 20px #0088ff;
        }

        /* ── BOTÓN HUELLA DIGITAL  */
        #fingerprint-wrap {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #fp-label {
            color: #00e5ff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 4px;
            opacity: 0.9;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00e5ff;
        }

        #fp-btn {
            position: relative;
            width: 130px;
            height: 130px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Anillos tecnológicos rotatorios */
        #fp-ring-outer {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 229, 255, 0.6);
            animation: spin 15s linear infinite;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 15px rgba(0, 229, 255, 0.2);
        }

        #fp-ring-inner {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #0088ff;
            border-bottom-color: #00e5ff;
            animation: spin-reverse 8s linear infinite;
            opacity: 0.8;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-reverse {
            100% {
                transform: rotate(-360deg);
            }
        }

        /* SVG huella centrado */
        #fp-btn svg {
            width: 85%;
            height: 85%;
            z-index: 2;
            filter: drop-shadow(0 0 8px #00e5ff);
        }

        /* overlay de scan */
        #fp-scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
            z-index: 3;
        }

        #fp-scan-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, #00e5ff, #ffffff, #00e5ff, transparent);
            box-shadow: 0 0 15px 5px rgba(0, 229, 255, 0.8);
            top: -4px;
            opacity: 0;
        }
        /* estado: escaneando */
        #fp-btn.scanning #fp-scan-line {
            opacity: 1;
            animation: scan-move 1.2s ease-in-out forwards;
        }

        @keyframes scan-move {
            0% {
                top: 0%;
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0.3;
            }
        }
        /* estado: éxito */
        #fp-btn.success #fp-ring-outer, #fp-btn.success #fp-ring-inner {
            border-color: #44ffaa;
            animation: none;
            opacity: 1;
            box-shadow: 0 0 20px #44ffaa;
        }

        #fp-btn.success .fp-path {
            stroke: #44ffaa !important;
            filter: drop-shadow(0 0 10px #44ffaa);
        }

        /* ── BIG BANG OVERLAY ── */
        #bigbang {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 998;
            pointer-events: none;
            display: none;
            background: radial-gradient(ellipse at center, #ffffff 0%, #ffeecc 15%, #aa44ff 40%, #000000 80%);
            opacity: 0;
        }

        /* ── CONTROLES MÚSICA ── */
        #music-bar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: min(440px, 92vw);
            padding: 18px 22px 16px;
            background: rgba(10,6,18,0.32);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 22px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.28);
            opacity: 0;
            transition: opacity 1.5s;
        }

        #song-title {
            color: #ffb3d9;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255,105,180,0.55);
            text-align: center;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Barra de progreso  psdt  si lees esto te quiero poleth */
        #progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.72rem;
            color: rgba(255,179,217,0.75);
            font-variant-numeric: tabular-nums;
        }

        #waveform-bar {
            flex: 1;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 0 2px;
        }

            #waveform-bar .wf-bar {
                flex: 1;
                min-width: 2px;
                border-radius: 2px;
                background: rgba(255,105,180,0.22);
                transition: background 0.25s ease, height 0.08s linear;
                will-change: height, transform;
            }

                #waveform-bar .wf-bar.wf-played {
                    background: #ff7fc4;
                    box-shadow: 0 0 6px rgba(255,105,180,0.7);
                }

        #music-controls {
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .mc-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,105,180,0.4);
            color: #fff;
            font-size: 1.15rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
            backdrop-filter: blur(4px);
        }

            .mc-btn:hover {
                background: rgba(255,20,147,0.3);
            }

            .mc-btn svg {
                display: block;
            }

            .mc-btn:active {
                transform: scale(0.92);
            }

        #btn-play {
            width: 52px;
            height: 52px;
            font-size: 1.45rem;
            border-color: rgba(255,105,180,0.7);
        }

        /* ── LISTA DE CANCIONES (estilo Spotify, tema universo) ── */
        #btn-list.active {
            background: rgba(255,20,147,0.35);
            border-color: rgba(255,105,180,0.9);
        }

        #btn-shuffle.active {
            background: rgba(255,20,147,0.35);
            border-color: rgba(255,105,180,0.9);
            box-shadow: 0 0 8px rgba(255,105,180,0.7), 0 0 16px rgba(255,20,147,0.4);
            text-shadow: 0 0 6px rgba(255,105,180,0.9);
        }

        #playlist-panel {
            position: absolute;
            bottom: calc(100% + 16px);
            right: -10px;
            width: 320px;
            max-height: 380px;
            background: linear-gradient(160deg, rgba(15,5,30,0.88) 0%, rgba(5,2,15,0.92) 100%);
            border: 1px solid rgba(255,105,180,0.25);
            border-radius: 16px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 0 30px rgba(150,50,255,0.25), inset 0 0 40px rgba(80,0,120,0.15);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(12px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            overflow: hidden;
        }

            #playlist-panel.open {
                opacity: 1;
                transform: translateY(0) scale(1);
                pointer-events: auto;
            }

            #playlist-panel::before {
                content: '';
                position: absolute;
                top: -40%;
                left: -20%;
                width: 160%;
                height: 160%;
                background: radial-gradient(circle at 30% 20%, rgba(170,80,255,0.10) 0%, transparent 45%), radial-gradient(circle at 80% 70%, rgba(0,200,255,0.08) 0%, transparent 50%);
                pointer-events: none;
            }

        #playlist-header {
            padding: 14px 16px 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c9a3ff;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            text-shadow: 0 0 8px rgba(170,80,255,0.6);
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        #playlist-scroll {
            overflow-y: auto;
            position: relative;
            z-index: 1;
            padding: 6px 0;
        }

            #playlist-scroll::-webkit-scrollbar {
                width: 5px;
            }

            #playlist-scroll::-webkit-scrollbar-track {
                background: transparent;
            }

            #playlist-scroll::-webkit-scrollbar-thumb {
                background: rgba(255,105,180,0.35);
                border-radius: 10px;
            }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            color: #e6d9ff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s;
            border-left: 2px solid transparent;
        }

            .playlist-item:hover {
                background: rgba(255,105,180,0.12);
            }

            .playlist-item.playing {
                background: rgba(0,229,255,0.10);
                border-left: 2px solid #00e5ff;
                color: #aef6ff;
            }

            .playlist-item .pl-icon {
                flex-shrink: 0;
                font-size: 0.95rem;
                opacity: 0.85;
                width: 18px;
                text-align: center;
            }

            .playlist-item .pl-name {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .playlist-item.playing .pl-icon::before {
                content: '♫';
            }

        .playlist-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px 5px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #6fd8ff;
            opacity: 0.75;
        }

            .playlist-divider::after {
                content: '';
                flex: 1;
                height: 1px;
                background: linear-gradient(to right, rgba(111,216,255,0.4), transparent);
            }
    </style>
</head>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script>
        // ── VERSIÓN DE LA APP (cache busting) ───────────────────────────────
        // Sube este número cada vez que subas cambios a GitHub en musica.js
        // o lyrics.js (1.0 -> 1.1 -> 1.2 ...). Es el ÚNICO lugar que necesitas
        // tocar: fuerza al navegador a descargar los archivos nuevos en vez
        // de usar la copia vieja guardada en caché.
        window.APP_VERSION = '1.0';
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const { cargarCancion } = await import(`./musica.js?v=${window.APP_VERSION}`);

        // ── ESCENA THREE.JS ───────────────────────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.00015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 8000);
        camera.position.set(0, 400, 1600);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 0.6;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;

        controls.autoRotateSpeed = 1.0;
        controls.minDistance = 50; controls.maxDistance = 4000;

        // ── GESTOR DE CARGA ───────────────────────────────────────────────────────
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const txtCarga = document.getElementById('texto-carga');
        const fpWrap = document.getElementById('fingerprint-wrap');
        const fpBtn = document.getElementById('fp-btn');
        const fpScanLine = document.getElementById('fp-scan-line');
        const bigbangEl = document.getElementById('bigbang');

        const loadingMgr = new THREE.LoadingManager(
            () => { txtCarga.style.display = 'none'; fpWrap.style.display = 'flex'; generarGatosEnEscena(); },
            (url, loaded, total) => { txtCarga.innerText = `Reuniendo estrellas y gatos... ${Math.round(loaded / total * 100)}%`; },
            // NUEVA FUNCIÓN DE ERROR:
            (url) => {
                console.error('Error al cargar:', url);
                txtCarga.innerText = 'Ups... faltan algunas estrellas (Error de carga)';
            }
        );

        // ── BOTÓN HUELLA ──────────────────────────────────────────────────────────
        fpBtn.addEventListener('click', () => {
            if (fpBtn.classList.contains('scanning') || fpBtn.classList.contains('success')) return;
            fpBtn.classList.add('scanning');
            fpScanLine.style.animation = 'none';
            void fpScanLine.offsetWidth;
            fpScanLine.style.animation = 'scan-move 1.2s ease-in-out forwards';

            setTimeout(() => {
                fpBtn.classList.remove('scanning');
                fpBtn.classList.add('success');
                // Pequeña vibración si disponible
                if (navigator.vibrate) navigator.vibrate([40, 30, 40]);

                // Esperar un momento y lanzar Big Bang
                setTimeout(() => { lanzarBigBang(); }, 400);
            }, 1300);
        });

        function lanzarBigBang() {
            cargarCancion(0, true);
            bigbangEl.style.display = 'block';

            // Fase 1: flash blanco explosivo
            bigbangEl.style.transition = 'opacity 0.15s ease-out';
            bigbangEl.style.opacity = '1';

            setTimeout(() => {
                // Fase 2: expandir y desvanecer
                bigbangEl.style.background = 'radial-gradient(ellipse at center, #ffffff 0%, #00e5ff 20%, #6600cc 50%, #000000 100%)';
                bigbangEl.style.transition = 'opacity 1.8s ease-in, transform 2s ease-out';
                bigbangEl.style.transform = 'scale(3)';
                bigbangEl.style.opacity = '0';

                // Ocultar pantalla inicio
                pantallaInicio.style.opacity = '0';
                setTimeout(() => { pantallaInicio.style.display = 'none'; bigbangEl.style.display = 'none'; bigbangEl.style.transform = 'scale(1)'; }, 1800);

            }, 200);

            document.getElementById('music-bar').style.opacity = '1';

            // VELOCIDAD DE ROTACIÓN TRAS EL BIG BANG
            controls.autoRotateSpeed = 0.5;


            let t = 0;
            const startZ = camera.position.z;
            const targetZ = 800;
            const camAnim = setInterval(() => {
                t += 0.02;
                camera.position.z = startZ + (targetZ - startZ) * (1 - Math.exp(-t * 2));
                camera.position.y = 400 * (1 - t * 0.5);
                if (t >= 1.2) clearInterval(camAnim);
            }, 16);
        }

        const textureLoader = new THREE.TextureLoader(loadingMgr);

        // ── LUCES ─────────────────────────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sunLight = new THREE.PointLight(0xffaa00, 1.5, 5000);
        sunLight.position.set(0, 0, 0); scene.add(sunLight);

        // La Tierra vive en su propia "capa de luz" (capa 1): así solo la
        // toca el sol real (sunLight) según hacia dónde mira cada punto de
        // su superficie, y NO la luz ambiental general de la escena (que es
        // la que aplana la iluminación pareja en todo lo demás). Resultado:
        // un lado de día bien iluminado y un lado de noche oscuro, que se
        // recorre en vivo conforme la Tierra gira sobre su propio eje —
        // igual que en la realidad. El resto del universo (otros planetas,
        // la Luna, estrellas) no se ve afectado, siguen con su brillo de
        // siempre porque se quedan en la capa 0 de luz.
        camera.layers.enable(1);
        sunLight.layers.enable(1);
        const earthNightGlow = new THREE.AmbientLight(0xffffff, 0.045); // un poquito de luz en el lado de noche, para que no sea negro absoluto (como el "earthshine" real)
        earthNightGlow.layers.set(1);
        scene.add(earthNightGlow);

        // ── TEXTURA PLANETA ───────────────────────────────────────────────────────
        function crearTexturaPlaneta(c1, c2, tipo) {
            const s = 512, c = document.createElement('canvas'); c.width = s; c.height = s;
            const x = c.getContext('2d');

            function hexToRgb(hex) {
                const v = parseInt(hex.replace('#', ''), 16);
                return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
            }
            function rgbToCss(r, g, b, a = 1) { return `rgba(${r|0},${g|0},${b|0},${a})`; }
            const rgb1 = hexToRgb(c1), rgb2 = hexToRgb(c2);

            // Ruido suave por suma de senos en varias frecuencias/fases (pseudo-Perlin
            // barato pero sin direccionalidad marcada, así no deja "rayas").
            function ruido(px, py, freq, seedA, seedB) {
                const a = Math.sin(px * freq + seedA) * Math.cos(py * freq * 1.3 + seedB);
                const b = Math.sin((px + py) * freq * 0.7 + seedA * 1.7);
                const cN = Math.cos((px - py) * freq * 0.5 + seedB * 2.1);
                return (a * 0.5 + b * 0.3 + cN * 0.2);
            }
            function fbm(px, py, octavas, seedA, seedB) {
                let total = 0, amp = 0.6, freq = 0.004;
                for (let o = 0; o < octavas; o++) {
                    total += ruido(px, py, freq, seedA + o, seedB + o) * amp;
                    freq *= 2.1; amp *= 0.55;
                }
                return total; // aprox -1..1
            }

            if (tipo === 'gas') {
                // ── Planeta gaseoso: bandas horizontales con ruido orgánico FUERTE,
                // sin rayas — el desplazamiento de cada banda usa fbm con alta amplitud
                // para que las bandas ondeen como en Júpiter/Saturno reales.
                const seedA = Math.random() * 100, seedB = Math.random() * 100;
                const img = x.createImageData(s, s);
                for (let py = 0; py < s; py++) {
                    const tBanda = py / s;
                    for (let px = 0; px < s; px++) {
                        // Warp fuerte: las bandas se tuercen orgánicamente en 2D
                        const warp = fbm(px, py, 5, seedA, seedB) * 22;
                        const warpX = fbm(px * 0.8, py * 1.2, 4, seedA + 30, seedB + 15) * 18;
                        const banda = Math.sin((tBanda * 14 + warp * 0.35 + warpX * 0.12) * Math.PI) * 0.5 + 0.5;
                        const detalle = fbm(px * 0.9, py * 0.4, 4, seedA + 9, seedB + 4) * 0.28;
                        const turb = fbm(px * 2.0, py * 1.0, 3, seedA + 55, seedB + 22) * 0.14;
                        const mezcla = Math.max(0, Math.min(1, banda * 0.65 + detalle + turb + 0.10));
                        const idx = (py * s + px) * 4;
                        img.data[idx] = rgb1[0] + (rgb2[0] - rgb1[0]) * mezcla;
                        img.data[idx + 1] = rgb1[1] + (rgb2[1] - rgb1[1]) * mezcla;
                        img.data[idx + 2] = rgb1[2] + (rgb2[2] - rgb1[2]) * mezcla;
                        img.data[idx + 3] = 255;
                    }
                }
                x.putImageData(img, 0, 0);
                // Remolinos/tormentas ovaladas (tipo Gran Mancha Roja) sobre las bandas
                for (let i = 0; i < 14; i++) {
                    const px = Math.random() * s, py = Math.random() * s;
                    const rw = 20 + Math.random() * 85, rh = rw * (0.35 + Math.random() * 0.3);
                    const tono = Math.random() < 0.5 ? rgb2 : rgb1;
                    const grad = x.createRadialGradient(px, py, 0, px, py, rw);
                    grad.addColorStop(0, rgbToCss(tono[0] * 1.2, tono[1] * 1.1, tono[2] * 1.05, 0.55));
                    grad.addColorStop(0.5, rgbToCss(tono[0], tono[1], tono[2], 0.25));
                    grad.addColorStop(1, rgbToCss(tono[0], tono[1], tono[2], 0));
                    x.save(); x.translate(px, py); x.rotate(Math.random() * Math.PI);
                    x.scale(1, rh / rw); x.fillStyle = grad;
                    x.beginPath(); x.arc(0, 0, rw, 0, Math.PI * 2); x.fill(); x.restore();
                }
            } else {
                // ── Planeta rocoso: base con ruido orgánico profundo +
                // cráteres con sombreado realista ───────────────────────────────────
                const seedA = Math.random() * 100, seedB = Math.random() * 100;
                const img = x.createImageData(s, s);
                for (let py = 0; py < s; py++) {
                    for (let px = 0; px < s; px++) {
                        const n = fbm(px, py, 6, seedA, seedB); // -1..1, más octavas
                        const n2 = fbm(px * 0.5, py * 0.5, 4, seedA + 77, seedB + 33) * 0.35;
                        const mezcla = Math.max(0, Math.min(1, n * 0.45 + n2 + 0.5));
                        const idx = (py * s + px) * 4;
                        img.data[idx] = rgb1[0] + (rgb2[0] - rgb1[0]) * mezcla;
                        img.data[idx + 1] = rgb1[1] + (rgb2[1] - rgb1[1]) * mezcla;
                        img.data[idx + 2] = rgb1[2] + (rgb2[2] - rgb1[2]) * mezcla;
                        img.data[idx + 3] = 255;
                    }
                }
                x.putImageData(img, 0, 0);

                // Cráteres con sombreado (borde oscuro + highlight claro, simulan relieve)
                for (let i = 0; i < 1400; i++) {
                    const px = Math.random() * s, py = Math.random() * s, r = 1.2 + Math.random() * 14;
                    x.globalAlpha = 0.28;
                    x.fillStyle = 'rgba(0,0,0,1)';
                    x.beginPath(); x.arc(px + r * 0.3, py + r * 0.3, r, 0, Math.PI * 2); x.fill();
                    x.globalAlpha = 0.24;
                    x.fillStyle = rgbToCss(...rgb2);
                    x.beginPath(); x.arc(px, py, r * 0.88, 0, Math.PI * 2); x.fill();
                    x.globalAlpha = 0.18;
                    x.fillStyle = 'rgba(255,255,255,1)';
                    x.beginPath(); x.arc(px - r * 0.35, py - r * 0.35, r * 0.42, 0, Math.PI * 2); x.fill();
                }
                x.globalAlpha = 1;

                // Grano fino general (textura de polvo/regolito)
                for (let i = 0; i < 6000; i++) {
                    x.globalAlpha = 0.02 + Math.random() * 0.05;
                    x.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,1)' : 'rgba(255,255,255,1)';
                    x.fillRect(Math.random() * s, Math.random() * s, 1, 1);
                }
                x.globalAlpha = 1;
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // ── ESTRELLAS DE FONDO
        const starGeo = new THREE.BufferGeometry();
        const sPos = new Float32Array(85000 * 3);
        const sTwinkle = new Float32Array(85000);
        const sPhase = new Float32Array(85000);
        const sSpeed = new Float32Array(85000);
        for (let i = 0; i < 85000 * 3; i += 3) {
            const r = 300 + Math.random() * 4000, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
            sPos[i] = r * Math.sin(p) * Math.cos(t); sPos[i + 1] = r * Math.sin(p) * Math.sin(t); sPos[i + 2] = r * Math.cos(p);
        }
        for (let i = 0; i < 85000; i++) {
            sTwinkle[i] = Math.random() < 0.75 ? 1.0 : 0.0;
            sPhase[i] = Math.random() * Math.PI * 2;
            sSpeed[i] = 0.6 + Math.random() * 1.6;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
        starGeo.setAttribute('twinkle', new THREE.BufferAttribute(sTwinkle, 1));
        starGeo.setAttribute('phase', new THREE.BufferAttribute(sPhase, 1));
        starGeo.setAttribute('speed', new THREE.BufferAttribute(sSpeed, 1));
        const starTwinkleMat = new THREE.ShaderMaterial({
            uniforms: { u_time: { value: 0.0 } },
            vertexShader: `
                    attribute float twinkle;
                    attribute float phase;
                    attribute float speed;
                    uniform float u_time;
                    varying float vAlpha;
                    void main(){
                        vec4 mv = modelViewMatrix * vec4(position, 1.0);
                        gl_Position = projectionMatrix * mv;
                        float base = 0.8;
                        float flicker = 0.5 + 0.5 * sin(u_time * speed + phase);
                        vAlpha = mix(base, base * (0.25 + 0.75 * flicker), twinkle);
                        gl_PointSize = 1.0 * (300.0 / -mv.z);
                    }
                `,
            fragmentShader: `
                    varying float vAlpha;
                    void main(){
                        gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha);
                    }
                `,
            transparent: true,
            depthWrite: false,
        });
        const starPoints = new THREE.Points(starGeo, starTwinkleMat);
        scene.add(starPoints);

        // ── SOL ───────────────────────────────────────────────────────────────────
        // Shader de plasma/fuego que cubre TODA la superficie esférica (no solo
        // anillos o planos pegados encima). Usa ruido 3D (simplex) sobre la
        // posición de cada punto de la esfera, animado en el tiempo, para que
        // se vea como turbulencia de fuego real fluyendo por toda la bola,
        // igual de vivo desde cualquier ángulo de cámara.
        const sunSurfaceVert = `
                varying vec3 vPos;
                varying vec3 vNormal;
                void main(){
                    vPos = position;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
        const sunSurfaceFrag = `
                uniform float u_time;
                uniform vec3 u_colHot;
                uniform vec3 u_colWarm;
                uniform vec3 u_colCool;
                varying vec3 vPos;
                varying vec3 vNormal;

                // Ruido simplex 3D (Ashima Arts / Stefan Gustavson, dominio público)
                vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
                vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v){
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy));
                    vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min(g.xyz, l.zxy);
                    vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod(i, 289.0);
                    vec4 p = permute(permute(permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0))
                      + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                      + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857;
                    vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_);
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4(x.xy, y.xy);
                    vec4 b1 = vec4(x.zw, y.zw);
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                    vec3 p0 = vec3(a0.xy, h.x);
                    vec3 p1 = vec3(a0.zw, h.y);
                    vec3 p2 = vec3(a1.xy, h.z);
                    vec3 p3 = vec3(a1.zw, h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                }
                float fbm(vec3 p){
                    float total = 0.0, amp = 0.5;
                    for (int i = 0; i < 4; i++) {
                        total += snoise(p) * amp;
                        p *= 2.05;
                        amp *= 0.55;
                    }
                    return total;
                }
                void main(){
                    // Coordenada estable sobre la esfera (radio 1), animada en el tiempo
                    // para que el plasma fluya y burbujee constantemente, igual de
                    // brillante en cualquier punto de la esfera (sin depender del
                    // ángulo de cámara, para que no se vea una mitad apagada).
                    vec3 p = normalize(vPos) * 3.0;
                    float n1 = fbm(p + vec3(0.0, 0.0, u_time * 0.25));
                    float n2 = fbm(p * 1.8 + vec3(u_time * 0.18, -u_time * 0.12, 5.0));
                    float plasma = (n1 * 0.65 + n2 * 0.35);
                    plasma = plasma * 0.5 + 0.5; // 0..1

                    vec3 col = mix(u_colCool, u_colWarm, smoothstep(0.25, 0.65, plasma));
                    col = mix(col, u_colHot, smoothstep(0.6, 0.95, plasma));

                    gl_FragColor = vec4(col * 1.15, 1.0);
                }
            `;
        const sunPaleta = { hot: [1.0, 0.98, 0.85], warm: [1.0, 0.55, 0.05], cool: [0.55, 0.12, 0.0] };
        const sunSurfaceMat = new THREE.ShaderMaterial({
            vertexShader: sunSurfaceVert,
            fragmentShader: sunSurfaceFrag,
            uniforms: {
                u_time: { value: 0.0 },
                u_colHot: { value: new THREE.Vector3(...sunPaleta.hot) },
                u_colWarm: { value: new THREE.Vector3(...sunPaleta.warm) },
                u_colCool: { value: new THREE.Vector3(...sunPaleta.cool) },
            }
        });
        const sun = new THREE.Mesh(new THREE.SphereGeometry(50, 96, 96), sunSurfaceMat);
        scene.add(sun);
        const sunCoronaMats = [sunSurfaceMat]; // se actualiza junto con el resto en el loop de animación

        // Glow ambiental amplio y MUY brillante alrededor de todo el conjunto
        const glowTex = new THREE.CanvasTexture((() => {
            const c = document.createElement('canvas'); c.width = 128; c.height = 128; const x = c.getContext('2d');
            const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0, 'rgba(255,235,180,1)'); g.addColorStop(0.25, 'rgba(255,170,40,0.65)'); g.addColorStop(0.55, 'rgba(255,90,10,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
            x.fillStyle = g; x.fillRect(0, 0, 128, 128); return c;
        })());
        const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffbb55, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        sunGlow.scale.set(850, 850, 1); sun.add(sunGlow);

        // Segundo glow, más pequeño y caliente, para reforzar el brillo del núcleo
        const sunGlowNucleo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        sunGlowNucleo.scale.set(280, 280, 1); sun.add(sunGlowNucleo);

        // Geometría compartida de "roca" para cinturones de meteoritos (Poleth y Saturno)
        const rocaGeo = new THREE.IcosahedronGeometry(1, 0);

        // ── PLANETA POLETH ────────────────────────────────────────────────────────
        const centerGroup = new THREE.Group();
        centerGroup.position.set(100, 20, 100); scene.add(centerGroup);
        const pMat = new THREE.MeshStandardMaterial({ map: crearTexturaPlaneta('#ff99cc', '#ff66aa', 'craters'), roughness: 0.6, metalness: 0.1, emissive: 0x330011, emissiveIntensity: 0.5 });
        const pMesh = new THREE.Mesh(new THREE.SphereGeometry(30, 64, 64), pMat);
        centerGroup.add(pMesh);
        crearGlowPlaneta(pMesh, 30, '#ff77b3', 0.22);

        // Anillo realista (mismo sistema de textura con bandas/divisiones que Saturno)
        // + cinturón de meteoritos orbitando, en vez de un toroide liso de un color.
        const ringTexPoleth = crearTexturaAnilloSaturno();
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(40, 62, 128),
            new THREE.MeshStandardMaterial({ map: ringTexPoleth, transparent: true, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.15, color: 0xffe9b0 })
        );
        {
            const posAttr = ring.geometry.attributes.position;
            const uvAttr = ring.geometry.attributes.uv;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i), vy = posAttr.getY(i);
                const dist = Math.sqrt(vx * vx + vy * vy);
                const t = (dist - 40) / (62 - 40);
                uvAttr.setXY(i, t, 0.5);
            }
            uvAttr.needsUpdate = true;
        }
        ring.rotation.x = Math.PI / 2; centerGroup.add(ring);

        const cinturonRocasPoleth = [];
        const N_ROCAS_POLETH = 170;
        for (let i = 0; i < N_ROCAS_POLETH; i++) {
            const radio = 41 + Math.random() * 20;
            const angInicial = Math.random() * Math.PI * 2;
            const inclinacion = (Math.random() - 0.5) * 0.10;
            const tam = 0.5 + Math.random() * 1.4;
            const tonoGris = 0.55 + Math.random() * 0.3;
            const mat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(tonoGris * 0.9, tonoGris * 0.75, tonoGris * 0.6),
                roughness: 0.95, metalness: 0.05
            });
            const roca = new THREE.Mesh(rocaGeo, mat);
            roca.scale.setScalar(tam);
            roca.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
            centerGroup.add(roca);
            cinturonRocasPoleth.push({
                mesh: roca, radio, ang: angInicial, inclinacion,
                velOrbita: 0.0025 + Math.random() * 0.004,
                velSpin: (Math.random() - 0.5) * 0.05
            });
        }
        function actualizarCinturonRocasPoleth() {
            cinturonRocasPoleth.forEach(r => {
                r.ang += r.velOrbita;
                r.mesh.position.set(
                    Math.cos(r.ang) * r.radio,
                    Math.sin(r.ang) * r.radio * r.inclinacion,
                    Math.sin(r.ang) * r.radio
                );
                r.mesh.rotation.x += r.velSpin;
                r.mesh.rotation.y += r.velSpin * 0.7;
            });
        }

        // ── CARTEL ────────────────────────────────────────────────────────────────
        const cv = document.createElement('canvas'); cv.width = 1400; cv.height = 900;
        const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 30; ctx.fillStyle = '#ffe0f0';
        ctx.font = 'italic bold 62px Segoe UI, sans-serif'; ctx.fillText('Poleth…', 700, 80);
        ctx.shadowBlur = 8; ctx.fillStyle = '#ffffff'; ctx.font = '28px Segoe UI, sans-serif';
        const lineas = ['si algún día el universo dejara de tener estrellas,', 'igual seguiría siendo hermoso porque tú existirías dentro de él.', '', 'Entre galaxias, canciones suaves y gatitos flotando por el espacio,', 'encontré mi lugar favorito… y eres tú.', 'Cada planeta de este pequeño universo guarda algo', 'de lo mucho que me haces sentir:', 'calma, felicidad, ternura y esa sensación bonita de hogar.', '', 'Ojalá pudieras verte como yo te veo:', 'como la estrella más linda en un cielo infinito. ✨', '', 'Y si algún día te pierdes entre el ruido del mundo,', 'recuerda esto: en algún rincón del universo siempre habrá', 'un lugar hecho solo para ti…', 'donde los gatitos flotan, la música nunca termina', 'y mi corazón te seguirá eligiendo una y otra vez. 🐾💫'];
        let yL = 160; lineas.forEach(l => { if (l === '') { yL += 18; return; } ctx.fillText(l, 700, yL); yL += 42; });
        const sign = new THREE.Mesh(new THREE.PlaneGeometry(90, 58), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, side: THREE.DoubleSide }));
        sign.position.y = 60; centerGroup.add(sign);

        // ── GATOS
        const catMaterials = [];
        [
            'imagenes/gato1.png', 'imagenes/gato2.png', 'imagenes/gato3.png', 'imagenes/gato4.png',
            'imagenes/gato5.png', 'imagenes/gato6.png', 'imagenes/gato7.png', 'imagenes/gato8.png'
        ].forEach(f => {
            const tex = textureLoader.load(f); tex.minFilter = THREE.LinearFilter; tex.colorSpace = THREE.SRGBColorSpace;
            catMaterials.push(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: true }));
        });
        function generarGatosEnEscena() {
            for (let i = 0; i < 85; i++) {
                const s = new THREE.Sprite(catMaterials[Math.floor(Math.random() * catMaterials.length)]);
                const sc = 35 + Math.random() * 45; s.scale.set(sc, sc, 1);
                const r = 200 + Math.random() * 600, t = Math.random() * 6.28, p = Math.acos(2 * Math.random() - 1);
                s.position.set(r * Math.sin(p) * Math.cos(t), r * Math.sin(p) * Math.sin(t), r * Math.cos(p));
                s.userData = { y: s.position.y, sp: Math.random() * 0.02 }; scene.add(s);
            }
            if (catMaterials.length > 0) { const cg = new THREE.Sprite(catMaterials[0]); cg.scale.set(40, 40, 1); cg.position.set(-25, 30, 5); centerGroup.add(cg); }
        }

        // ── TIERRA (textura de imagen, liviana) ─────────────────────────────────
        // Antes esto era un shader GLSL que recalculaba ruido procedural por
        // cada píxel en cada frame (costoso). Ahora usamos una imagen fija
        // (tieramor.png, mapa equirectangular) igual que el resto de
        // planetas: se carga UNA sola vez y de ahí en adelante solo se
        // muestrea, sin recalcular nada — mucho más rápido de cargar y de
        // renderizar cuadro a cuadro.

        // ── PLANETAS ──────────────────────────────────────────────────────────────
        // Pequeño glow propio (sprite con degradado) para que cada planeta
        // destaque un poco entre tanta nebulosa/estrella, aunque esté lejos
        // del sunLight. No es una luz real (no afecta a otros objetos), solo
        // un halo visual pegado al planeta mismo.
        function crearGlowPlaneta(mesh, radio, colorHex, intensidad = 0.30) {
            const c = document.createElement('canvas'); c.width = 128; c.height = 128;
            const x = c.getContext('2d');
            const col = new THREE.Color(colorHex);
            const r = Math.round(col.r * 255), g = Math.round(col.g * 255), b = Math.round(col.b * 255);
            const grad = x.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, `rgba(${r},${g},${b},${intensidad})`);
            grad.addColorStop(0.5, `rgba(${r},${g},${b},${intensidad * 0.3})`);
            grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
            x.fillStyle = grad; x.fillRect(0, 0, 128, 128);
            const tex = new THREE.CanvasTexture(c);
            const glow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            glow.scale.set(radio * 4.2, radio * 4.2, 1);
            mesh.add(glow);
            return glow;
        }

        const solarSystem = new THREE.Group(); scene.add(solarSystem);

        // ── SISTEMA DE ÓRBITAS REAL ─────────────────────────────────────────────
        // Cada planeta orbita alrededor del sol (origen 0,0,0) en un círculo de
        // radio fijo, con su propia velocidad angular y un ángulo inicial al azar
        // para que no arranquen todos alineados. En el loop de animación se
        // actualiza su posición real (no solo rotación sobre sí mismo).
        const planetasOrbitando = [];
        function registrarOrbita(mesh, radioOrbital, velOrbital, velSpin) {
            const angInicial = Math.random() * Math.PI * 2;
            planetasOrbitando.push({ mesh, radio: radioOrbital, ang: angInicial, velOrbital, velSpin });
        }

        function addP(radioOrbital, sz, c1, c2, t, velOrbital) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(sz, 64, 64), new THREE.MeshStandardMaterial({ map: crearTexturaPlaneta(c1, c2, t), roughness: 0.8, metalness: 0.0, emissive: new THREE.Color(c2).multiplyScalar(0.06) }));
            solarSystem.add(m);
            crearGlowPlaneta(m, sz, c2, 0.25);
            registrarOrbita(m, radioOrbital, velOrbital, 0.006 + Math.random() * 0.006);
            return m;

        // Textura del anillo: bandas concéntricas con distinta densidad/brillo y
        // huecos (divisiones), como los anillos reales — no un color plano.
        function crearTexturaAnilloSaturno() {
            const s = 512, c = document.createElement('canvas'); c.width = s; c.height = 1;
            const x = c.getContext('2d');
            // Generamos por columnas (cada columna = un radio del anillo)
            for (let i = 0; i < s; i++) {
                const t = i / s; // 0 = borde interior, 1 = borde exterior
                // Patrón de bandas con ruido + un par de "huecos" (divisiones)
                let brillo = 0.35 + 0.4 * Math.sin(t * 40.0) * Math.sin(t * 13.0 + 1.3);
                brillo += (Math.random() - 0.5) * 0.12;
                // Divisiones oscuras (como la división de Cassini)
                const div1 = Math.exp(-Math.pow((t - 0.42) * 60, 2));
                const div2 = Math.exp(-Math.pow((t - 0.68) * 90, 2));
                brillo *= (1.0 - div1 * 0.85) * (1.0 - div2 * 0.7);
                // Bordes interior/exterior se desvanecen
                const fadeIn = Math.min(1, t / 0.04);
                const fadeOut = Math.min(1, (1 - t) / 0.04);
                brillo = Math.max(0, Math.min(1, brillo)) * fadeIn * fadeOut;
                const tono = 200 + brillo * 40; // crema-dorado
                x.fillStyle = `rgba(${tono},${tono * 0.92},${tono * 0.72},${brillo})`;
                x.fillRect(i, 0, 1, 1);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const anilloTex = crearTexturaAnilloSaturno();
        const sr = new THREE.Mesh(
            new THREE.RingGeometry(40, 75, 128),
            new THREE.MeshStandardMaterial({ map: anilloTex, transparent: true, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.1 })
        );
        // RingGeometry usa UVs radiales raros por defecto; remapeamos para que la
        // textura (que varía a lo largo de X) se proyecte del borde interior al exterior.
        {
            const posAttr = sr.geometry.attributes.position;
            const uvAttr = sr.geometry.attributes.uv;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i), vy = posAttr.getY(i);
                const dist = Math.sqrt(vx * vx + vy * vy);
                const t = (dist - 40) / (75 - 40);

        // ── NEBULOSAS REALISTAS ───────────────────────────────────────────────────
        function crearTexturaNebulosaCielo(r, g, b) {
            const s = 512, c = document.createElement('canvas'); c.width = s; c.height = s;
            const x = c.getContext('2d'); x.clearRect(0, 0, s, s);
            const grad = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
            grad.addColorStop(0.0, `rgba(${r},${g},${b},0.6)`);
            grad.addColorStop(0.3, `rgba(${r},${g},${b},0.35)`);
            grad.addColorStop(0.65, `rgba(${r},${g},${b},0.1)`);
            grad.addColorStop(1.0, `rgba(${r},${g},${b},0.0)`);
            x.save(); x.beginPath(); x.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); x.clip();
            x.fillStyle = grad; x.fillRect(0, 0, s, s);
            for (let i = 0; i < 40; i++) {
                const ang = Math.random() * Math.PI * 2, dist = Math.random() * s * 0.42;
                const cx2 = s / 2 + Math.cos(ang) * dist, cy2 = s / 2 + Math.sin(ang) * dist, pr = 15 + Math.random() * 80;
                const ig = x.createRadialGradient(cx2, cy2, 0, cx2, cy2, pr);
                const alpha = 0.08 + Math.random() * 0.22;
                ig.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
                ig.addColorStop(0.5, `rgba(${Math.min(r + 60, 255)},${Math.min(g + 40, 255)},${Math.min(b + 60, 255)},${alpha * 0.4})`);
                ig.addColorStop(1, `rgba(${r},${g},${b},0.0)`);
                x.fillStyle = ig;
                x.save(); x.translate(cx2, cy2); x.rotate(Math.random() * Math.PI);
                x.scale(1 + Math.random() * 1.5, 0.3 + Math.random() * 0.7);
                x.beginPath(); x.arc(0, 0, pr, 0, Math.PI * 2); x.fill(); x.restore();
            }
            for (let i = 0; i < 5; i++) {
                const ang = Math.random() * Math.PI * 2, dist = Math.random() * s * 0.25;
                const cx2 = s / 2 + Math.cos(ang) * dist, cy2 = s / 2 + Math.sin(ang) * dist, pr = 8 + Math.random() * 25;
                const ig = x.createRadialGradient(cx2, cy2, 0, cx2, cy2, pr);
                ig.addColorStop(0, `rgba(255,255,255,0.35)`);
                ig.addColorStop(0.3, `rgba(${Math.min(r + 80, 255)},${Math.min(g + 80, 255)},${Math.min(b + 80, 255)},0.18)`);
                ig.addColorStop(1, `rgba(${r},${g},${b},0.0)`);
                x.fillStyle = ig; x.beginPath(); x.arc(cx2, cy2, pr, 0, Math.PI * 2); x.fill();
            }
            for (let i = 0; i < 200; i++) {
                const ang = Math.random() * Math.PI * 2, dist = Math.random() * s * 0.48;
                const px = s / 2 + Math.cos(ang) * dist, py = s / 2 + Math.sin(ang) * dist;
                x.globalAlpha = 0.03 + Math.random() * 0.12;
                x.fillStyle = `rgba(${Math.min(r + 100, 255)},${Math.min(g + 100, 255)},${Math.min(b + 100, 255)},1)`;
                x.beginPath(); x.arc(px, py, 0.5 + Math.random() * 2, 0, Math.PI * 2); x.fill();
            }
            x.restore();
            return new THREE.CanvasTexture(c);
        }

        // ── 3 NEBULOSAS GLSL VOLUMÉTRICAS (efecto 3D por capas) ──────────────────
        // Cada nebulosa = grupo de 5 planos apilados con offsets, rotaciones y
        // semillas distintas → al orbitar la cámara se ve profundidad real.
        const nebulaGLSLVert = `
                varying vec2 vUv;
                void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
            `;
        const nebulaGLSLFrag = `
                uniform float u_time;
                uniform float u_speed;
                uniform float u_seed;
                uniform float u_layerOpacity;
                uniform vec3  u_colOuter;
                uniform vec3  u_colMid;
                uniform vec3  u_colCore;
                uniform vec3  u_colCenter;
                varying vec2 vUv;

                float noise(vec3 x){
                    vec3 p=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
                    float n=p.x+p.y*57.0+113.0*p.z;
                    return mix(mix(mix(fract(sin(n)*43758.5453),fract(sin(n+1.0)*43758.5453),f.x),
                                   mix(fract(sin(n+57.0)*43758.5453),fract(sin(n+58.0)*43758.5453),f.x),f.y),
                               mix(mix(fract(sin(n+113.0)*43758.5453),fract(sin(n+114.0)*43758.5453),f.x),
                                   mix(fract(sin(n+170.0)*43758.5453),fract(sin(n+171.0)*43758.5453),f.x),f.y),f.z);
                }
                float fbm(vec3 x){
                    float v=0.0,a=0.5; vec3 s=vec3(100.0);
                    for(int i=0;i<5;++i){v+=a*noise(x);x=x*2.0+s;a*=0.5;} return v;
                }
                mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}

                void main(){
                    vec2 uv=(vUv-0.5)*2.0; uv*=1.8;
                    vec2 d=uv*rot(0.785398+u_seed*0.5);
                    float t=u_time*u_speed+u_seed*3.7;
                    float dist=length(vec2(d.x*0.45,d.y*1.9));
                    float mask=smoothstep(1.55,0.0,dist);
                    vec3 p=vec3(d*2.0+u_seed*5.0,t);
                    vec3 q=vec3(fbm(p),fbm(p+vec3(1.7+u_seed)),0.0);
                    vec3 r2=vec3(fbm(p+q*2.0+t),fbm(p+q*2.0-t),0.0);
                    float den=fbm(p+r2*2.5);
                    den=smoothstep(0.05,0.88,den*mask*1.35);
                    den=pow(den,2.0);
                    vec3 fc=mix(vec3(0.0), u_colOuter,  smoothstep(0.0,0.2,den));
                    fc     =mix(fc,        u_colMid,    smoothstep(0.2,0.5,den));
                    fc     =mix(fc,        u_colCore,   smoothstep(0.5,0.8,den));
                    fc     =mix(fc,        u_colCenter, smoothstep(0.8,1.0,den)*mask);
                    gl_FragColor=vec4(fc, den*u_layerOpacity);
                }
            `;

        // Función que crea una nebulosa volumétrica como grupo de capas
        function crearNebulaVolumen(cx, cy, cz, baseSize, speed, rxBase, ryBase, paleta) {
            const grupo = new THREE.Group();
            grupo.position.set(cx, cy, cz);
            // 5 capas: varían tamaño, profundidad a lo largo del eje local Z,
            // rotación propia y semilla de ruido → apariencia tridimensional
            const capas = [
                { dz: 0, scale: 1.00, seed: 0.0, op: 0.62, rx: 0.00, ry: 0.00 },
                { dz: 90, scale: 0.82, seed: 1.3, op: 0.48, rx: 0.18, ry: 0.12 },
                { dz: -90, scale: 0.88, seed: 2.7, op: 0.44, rx: -0.15, ry: -0.10 },
                { dz: 170, scale: 0.65, seed: 4.1, op: 0.35, rx: 0.28, ry: -0.20 },
                { dz: -160, scale: 0.70, seed: 5.5, op: 0.30, rx: -0.22, ry: 0.18 },
            ];
            const mats = [];
            capas.forEach(c => {
                const mat = new THREE.ShaderMaterial({
                    vertexShader: nebulaGLSLVert,
                    fragmentShader: nebulaGLSLFrag,
                    uniforms: {
                        u_time: { value: 0.0 },
                        u_speed: { value: speed },
                        u_seed: { value: c.seed },
                        u_layerOpacity: { value: c.op },
                        u_colOuter: { value: new THREE.Vector3(...paleta.outer) },
                        u_colMid: { value: new THREE.Vector3(...paleta.mid) },
                        u_colCore: { value: new THREE.Vector3(...paleta.core) },
                        u_colCenter: { value: new THREE.Vector3(...paleta.center) },
                    },
                    transparent: true, depthWrite: false,
                    blending: THREE.AdditiveBlending, side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(baseSize * c.scale, baseSize * c.scale), mat
                );
                // Offset en Z local para que cada capa esté a distinta profundidad
                mesh.position.set(0, 0, c.dz);
                mesh.rotation.x = rxBase + c.rx;
                mesh.rotation.y = ryBase + c.ry;
                grupo.add(mesh);
                mats.push(mat);
            });
            scene.add(grupo);
            return mats; // retorna los materiales para animar u_time
        }

        // ── NEBULOSA GATO 🐱 ──────────────────────────────────────────────────────
        // Máscara matemática: cabeza (círculo) + 2 orejas (triángulos) + bigotes (líneas)
        // La nebulosa GLSL solo brilla donde la silueta de gato lo permite.
        const catNebulaVert = `
                varying vec2 vUv;
                void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
            `;
        const catNebulaFrag = `
                uniform float u_time;
                varying vec2 vUv;

                // ── ruido y fbm ────────────────────────────────────────────────────────
                float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
                float noise(vec3 x){
                    vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
                    return mix(mix(mix(hash(i),            hash(i+vec3(1,0,0)),f.x),
                                   mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                                   mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
                }
                float fbm(vec3 p){
                    float v=0.0,a=0.5;
                    for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.1+vec3(5.2,1.3,3.7);a*=0.5;}
                    return v;
                }

                // ── SDF helpers ───────────────────────────────────────────────────────
                float sdCircle(vec2 p, vec2 c, float r){ return length(p-c)-r; }

                // triángulo orientable para orejas
                float sdTriangle(vec2 p, vec2 a, vec2 b, vec2 c2){
                    vec2 e0=b-a,e1=c2-b,e2=a-c2;
                    vec2 v0=p-a, v1=p-b, v2=p-c2;
                    vec2 pq0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.0,1.0);
                    vec2 pq1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.0,1.0);
                    vec2 pq2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.0,1.0);
                    float s=sign(e0.x*e2.y-e0.y*e2.x);
                    vec2 d=min(min(vec2(dot(pq0,pq0),s*(v0.x*e0.y-v0.y*e0.x)),
                                   vec2(dot(pq1,pq1),s*(v1.x*e1.y-v1.y*e1.x))),
                                   vec2(dot(pq2,pq2),s*(v2.x*e2.y-v2.y*e2.x)));
                    return -sqrt(d.x)*sign(d.y);
                }

                // bigote: segmento engrosado
                float sdCapsule(vec2 p, vec2 a, vec2 b, float r){
                    vec2 pa=p-a, ba=b-a;
                    float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
                    return length(pa-ba*h)-r;
                }

                // ── Máscara silueta de gato ────────────────────────────────────────────
                float catMask(vec2 p){
                    // cabeza: círculo centrado en (0, -0.05), radio 0.38
                    float head = sdCircle(p, vec2(0.0,-0.05), 0.38);

                    // oreja izquierda: triángulo apuntando arriba-izquierda
                    float earL = sdTriangle(p,
                        vec2(-0.38, 0.18),   // base izq
                        vec2(-0.12, 0.18),   // base der
                        vec2(-0.30, 0.52)    // punta
                    );
                    // oreja derecha: simétrica
                    float earR = sdTriangle(p,
                        vec2( 0.12, 0.18),
                        vec2( 0.38, 0.18),
                        vec2( 0.30, 0.52)
                    );

                    // unión suave de cabeza + orejas
                    float body = min(head, min(earL, earR));

                    // bigotes: 3 a cada lado, suavizados
                    float r = 0.012; // grosor bigote
                    float w1L = sdCapsule(p, vec2(-0.38,-0.05), vec2(-0.72,-0.02), r);
                    float w2L = sdCapsule(p, vec2(-0.38,-0.10), vec2(-0.72,-0.14), r);
                    float w3L = sdCapsule(p, vec2(-0.38,-0.00), vec2(-0.72, 0.06), r);
                    float w1R = sdCapsule(p, vec2( 0.38,-0.05), vec2( 0.72,-0.02), r);
                    float w2R = sdCapsule(p, vec2( 0.38,-0.10), vec2( 0.72,-0.14), r);
                    float w3R = sdCapsule(p, vec2( 0.38,-0.00), vec2( 0.72, 0.06), r);
                    float whiskers = min(min(min(w1L,w2L),min(w3L,w1R)),min(w2R,w3R));

                    // la máscara total: interior (SDF < 0) → 1, exterior → 0
                    // bigotes más tenues que el cuerpo
                    float bodyMask    = smoothstep( 0.04, -0.04, body);
                    float whiskerMask = smoothstep( 0.008,-0.008, whiskers) * 0.55;
                    return max(bodyMask, whiskerMask);
                }

                void main(){
                    vec2 uv = (vUv - 0.5) * 2.2;   // -1.1 … 1.1

                    float mask = catMask(uv);
                    if(mask < 0.01) discard;         // fuera del gato → transparente

                    // animación de nebulosa dentro de la silueta
                    float t = u_time * 0.08;
                    vec3 p  = vec3(uv * 2.5, t);
                    vec3 q  = vec3(fbm(p), fbm(p + vec3(1.7,0.9,2.3)), 0.0);
                    vec3 r2 = vec3(fbm(p + q*2.0 + t), fbm(p + q*1.8 - t), 0.0);
                    float den = fbm(p + r2 * 2.5);
                    den = smoothstep(0.15, 0.85, den);
                    den = pow(den, 1.6) * mask;      // recortado por silueta

                    // paleta: rosa-lila-violeta nacarado, como nebulosa de estrella
                    vec3 cA = vec3(0.08, 0.02, 0.28);  // violeta oscuro
                    vec3 cB = vec3(0.45, 0.05, 0.55);  // violeta medio
                    vec3 cC = vec3(0.80, 0.30, 0.75);  // rosa-malva
                    vec3 cD = vec3(0.95, 0.70, 0.90);  // blanco rosado

                    vec3 col = mix(cA, cB, smoothstep(0.0, 0.35, den));
                    col       = mix(col,cC, smoothstep(0.35,0.70, den));
                    col       = mix(col,cD, smoothstep(0.70,1.00, den));

                    // brillo suave en el núcleo de las orejas y el centro
                    float glow = smoothstep(0.6,1.0,den) * mask * 0.4;
                    col += vec3(0.3,0.1,0.4) * glow;

                    gl_FragColor = vec4(col, den * 0.82);
                }
            `;

        const catNebulaMat = new THREE.ShaderMaterial({
            vertexShader: catNebulaVert,
            fragmentShader: catNebulaFrag,

        // Posición en el hueco vacío: arriba-izquierda al fondo, bien separada del sol

        // ── GALAXIAS LEJANAS ──────────────────────────────────────────────────────
        function crearTexturaGalaxia(tipo) {
            const s = 256, c = document.createElement('canvas'); c.width = s; c.height = s;
            const x = c.getContext('2d'); x.clearRect(0, 0, s, s);
            if (tipo === 'espiral') {
                const gc = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s * 0.12);
                gc.addColorStop(0, 'rgba(255,240,200,0.95)'); gc.addColorStop(0.5, 'rgba(220,180,120,0.5)'); gc.addColorStop(1, 'rgba(180,120,60,0.0)');
                x.fillStyle = gc; x.beginPath(); x.arc(s / 2, s / 2, s * 0.12, 0, Math.PI * 2); x.fill();
                for (let arm = 0; arm < 3; arm++) {
                    const baseAngle = arm * (Math.PI * 2 / 3);
                    for (let i = 0; i < 120; i++) {
                        const t = i / 120, ang = baseAngle + t * Math.PI * 2.5, dist = t * s * 0.44;
                        const px = s / 2 + Math.cos(ang) * dist, py = s / 2 + Math.sin(ang) * dist;
                        x.globalAlpha = 0.6 * (1 - t); x.fillStyle = `rgba(180,200,255,1)`;
                        x.beginPath(); x.arc(px, py, 0.5 + Math.random(), 0, Math.PI * 2); x.fill();
                    }
                }
                const gh = x.createRadialGradient(s / 2, s / 2, s * 0.1, s / 2, s / 2, s / 2);
                gh.addColorStop(0, 'rgba(150,170,220,0.12)'); gh.addColorStop(1, 'rgba(0,0,0,0)');
                x.globalAlpha = 1; x.fillStyle = gh;
                x.save(); x.translate(s / 2, s / 2); x.scale(1, 0.35); x.beginPath(); x.arc(0, 0, s / 2, 0, Math.PI * 2); x.fill(); x.restore();
            } else {
                const ge = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s * 0.4);
                ge.addColorStop(0, 'rgba(255,230,160,0.9)'); ge.addColorStop(0.4, 'rgba(200,160,80,0.4)'); ge.addColorStop(1, 'rgba(100,60,0,0.0)');
                x.fillStyle = ge; x.save(); x.translate(s / 2, s / 2); x.scale(1, 0.55); x.beginPath(); x.arc(0, 0, s * 0.4, 0, Math.PI * 2); x.fill(); x.restore();
                for (let i = 0; i < 80; i++) {
                    const ang = Math.random() * Math.PI * 2, dist = Math.random() * s * 0.35;
                    const px = s / 2 + Math.cos(ang) * dist, py = s / 2 + Math.sin(ang) * dist * 0.55;
                    x.globalAlpha = 0.2 + Math.random() * 0.4; x.fillStyle = 'rgba(255,240,200,1)';
                    x.beginPath(); x.arc(px, py, 0.4 + Math.random() * 0.8, 0, Math.PI * 2); x.fill();
                }
            }
            return new THREE.CanvasTexture(c);
        }

        const galaxiasConfig = [
            { pos: [-2800, 600, -1500], scX: 180, scY: 70, tipo: 'espiral', rot: 0.4 },

        // ── AGUJEROS NEGROS REALISTAS ──────────────────────────────────────────────
        // Horizonte de eventos (esfera negra) + disco de acreción brillante (shader
        // radial naranja/blanco) + halo de lente gravitacional (arco vertical que
        // simula la luz del disco curvándose por detrás, efecto tipo Interstellar).
        const bhDiscVert = `
                varying vec2 vUv;
                void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
            `;
        const bhDiscFrag = `
                uniform float u_time;
                uniform vec3 u_colHot;
                uniform vec3 u_colWarm;
                uniform vec3 u_colCool;
                varying vec2 vUv;
                void main(){
                    vec2 c = vUv - 0.5;
                    float r = length(c) * 2.0; // 0 centro -> 1 borde
                    if (r > 1.0 || r < 0.34) discard; // anillo hueco (deja ver el horizonte)
                    float ang = atan(c.y, c.x);
                    // remolino: bandas que giran con el tiempo, más densas cerca del centro
                    float swirl = sin(ang * 6.0 + u_time * 1.6 - r * 10.0) * 0.5 + 0.5;
                    float band = sin(ang * 14.0 - u_time * 2.4 + r * 18.0) * 0.5 + 0.5;
                    float bright = mix(swirl, band, 0.4);
                    // más brillante y cálido cerca del horizonte interior, se enfría hacia afuera
                    float innerGlow = smoothstep(1.0, 0.34, r);
                    vec3 col = mix(u_colCool, u_colWarm, innerGlow);
                    col = mix(col, u_colHot, pow(innerGlow, 3.0) * (0.5 + 0.5 * bright));
                    float edgeFade = smoothstep(0.34, 0.42, r) * smoothstep(1.0, 0.82, r);
                    float alpha = edgeFade * (0.55 + 0.45 * bright);
                    gl_FragColor = vec4(col, alpha);
                }
            `;
        const bhHaloFrag = `
                uniform float u_time;
                uniform vec3 u_colHot;
                uniform vec3 u_colWarm;
                varying vec2 vUv;
                void main(){
                    vec2 c = vUv - 0.5;
                    float r = length(c) * 2.0;
                    if (r > 1.0 || r < 0.78) discard;
                    float ang = atan(c.y, c.x);
                    float flicker = 0.6 + 0.4 * sin(ang * 10.0 + u_time * 2.0);
                    float edgeFade = smoothstep(0.78, 0.86, r) * smoothstep(1.0, 0.9, r);
                    vec3 col = mix(u_colWarm, u_colHot, flicker);
                    gl_FragColor = vec4(col, edgeFade * 0.85);
                }
            `;

        function crearAgujeroNegro(cx, cy, cz, radioHorizonte, inclinacion, rotY, paleta) {
            const grupo = new THREE.Group();
            grupo.position.set(cx, cy, cz);

            // Horizonte de eventos: esfera negra absoluta, no refleja luz
            const horizonte = new THREE.Mesh(
                new THREE.SphereGeometry(radioHorizonte, 48, 48),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            grupo.add(horizonte);

            // Disco de acreción principal (inclinado, plano del disco)
            const discoMat = new THREE.ShaderMaterial({
                vertexShader: bhDiscVert,
                fragmentShader: bhDiscFrag,
                uniforms: {
                    u_time: { value: 0.0 },
                    u_colHot: { value: new THREE.Vector3(...paleta.hot) },
                    u_colWarm: { value: new THREE.Vector3(...paleta.warm) },
                    u_colCool: { value: new THREE.Vector3(...paleta.cool) },
                },
                transparent: true, depthWrite: false, side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const disco = new THREE.Mesh(
                new THREE.PlaneGeometry(radioHorizonte * 6.2, radioHorizonte * 6.2), discoMat
            );
            disco.rotation.x = Math.PI / 2 + inclinacion;
            disco.rotation.z = rotY;
            grupo.add(disco);

            // Halo de lente gravitacional: arco vertical que simula la luz curvada
            // por detrás del agujero negro (visible "por arriba y abajo" del horizonte)
            const haloMat = new THREE.ShaderMaterial({
                vertexShader: bhDiscVert,
                fragmentShader: bhHaloFrag,
                uniforms: {
                    u_time: { value: 0.0 },
                    u_colHot: { value: new THREE.Vector3(...paleta.hot) },
                    u_colWarm: { value: new THREE.Vector3(...paleta.warm) },
                },
                transparent: true, depthWrite: false, side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const halo = new THREE.Mesh(
                new THREE.PlaneGeometry(radioHorizonte * 5.0, radioHorizonte * 5.0), haloMat
            );
            halo.rotation.z = rotY + Math.PI / 2.1;
            grupo.add(halo);

            // Glow ambiental suave alrededor de todo el conjunto
            const glowTexBH = new THREE.CanvasTexture((() => {
                const c = document.createElement('canvas'); c.width = 128; c.height = 128; const x = c.getContext('2d');
                const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
                g.addColorStop(0, `rgba(${paleta.warm[0] * 255},${paleta.warm[1] * 255},${paleta.warm[2] * 255},0.5)`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                x.fillStyle = g; x.fillRect(0, 0, 128, 128); return c;
            })());
            const glow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glowTexBH, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            glow.scale.set(radioHorizonte * 9, radioHorizonte * 9, 1);
            grupo.add(glow);

            scene.add(grupo);
            return { grupo, mats: [discoMat, haloMat] };
        }

        const agujerosNegros = [];

        // Agujero negro 1 — paleta naranja-dorada clásica, arriba-lejos
        agujerosNegros.push(crearAgujeroNegro(
            -3000, 1800, 1600, 70, 0.55, 0.4,
            { hot: [1.0, 0.95, 0.85], warm: [1.0, 0.55, 0.15], cool: [0.35, 0.08, 0.0] }
        ));

        // Agujero negro 2 — paleta azul-violeta fría, abajo-lejos, lado opuesto
        agujerosNegros.push(crearAgujeroNegro(
            2500, -1700, -2600, 60, -0.45, -0.7,
            { hot: [0.85, 0.92, 1.0], warm: [0.25, 0.45, 0.95], cool: [0.05, 0.05, 0.30] }
        ));

        // Agujero negro 3 — pequeño, amarillo brillante puro, muy al fondo arriba-izquierda
        agujerosNegros.push(crearAgujeroNegro(
            -4500, 2600, -2200, 38, 0.35, 1.1,
            { hot: [1.0, 0.98, 0.80], warm: [1.0, 0.80, 0.10], cool: [0.40, 0.25, 0.0] }
        ));

        // Agujero negro 4 — grande, naranja intenso, muy lejos abajo-derecha
        agujerosNegros.push(crearAgujeroNegro(
            4800, -2400, 1400, 95, -0.30, -1.3,
            { hot: [1.0, 0.92, 0.70], warm: [1.0, 0.42, 0.02], cool: [0.30, 0.06, 0.0] }

        // Agujero negro 5 — mediano, ámbar dorado, muy al fondo al frente-derecha
        agujerosNegros.push(crearAgujeroNegro(

            { hot: [1.0, 0.96, 0.75], warm: [0.95, 0.65, 0.08], cool: [0.32, 0.16, 0.0] }
